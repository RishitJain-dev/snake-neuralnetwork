<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Snake</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <canvas id="game" width="576" height="576"></canvas>

        <div id="stats">
            <p class="info">Generation: <span id="generation">0</span></p>
            <p class="info">Best score: <span id="bestScore">0</span></p>
            <p class="info">Current score: <span id="currentScore">0</span></p>
        </div>

        <div id="controls">
            <button id="startBtn" class="button">Start</button>
            <button id="pauseBtn" class="button">Pause</button>
            <input type="range" id="speed" class="dial" min="1" max="100" value="8">
        </div>

        <script src="js/game.js"></script>
        <script src="js/render.js"></script>
        <script src="js/main.js"></script>
    </body>
</html>
