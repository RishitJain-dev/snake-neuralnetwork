<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Snake</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <img id="logo" src="logo.png">
        <div id="modes">
            <button id="trainModeBtn">Train AI</button>
            <button id="playModeBtn">Play yourself</button>
            <button id="watchModeBtn">Watch AI play</button>
        </div>

        <div id="boards">>
            <canvas id="game" width="576" height="576"></canvas>
            <canvas id="brain" width="520" height="576"></canvas>
        </div>

        <p id="message" class="info"></p>

        <div id="aiStats">
            <p class="info">Generation: <span id="generation">0</span></p>
            <p class="info">Best score: <span id="bestScore">0</span></p>
            <p class="info">Current score: <span id="currentScore">0</span></p>
        </div>

        <div id="compareStats">
            <p class="info">You: last <span id="youLast">-</span>, best <span id="youBest">0</span></p>
            <p class="info">AI: last <span id="aiLast">-</span>, best <span id="aiBest">0</span></p>
        </div>

        <div id="aiControls">
            <button id="startBtn">Start</button>
            <button id="pauseBtn">Pause</button>
            <input type="range" id="speed" min="1" max="100" value="8">
            <button id="resetBtn">Reset training</button>
        </div>

        <script src="js/rewards.js"></script>
        <script src="js/game.js"></script>
        <script src="js/network.js"></script>
        <script src="js/genetic.js"></script>
        <script src="js/render.js"></script>
        <script src="js/main.js"></script>
    </body>
</html>
